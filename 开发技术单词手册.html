<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开发技术单词手册 · Tech Wordbook</title>
<meta name="description" content="本轮对话出现的技术英语词条汇总，支持搜索、分类筛选与折叠查看详解。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23131A24'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' fill='%23ffffff' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#F3F5F8;
  --surface:#FFFFFF;
  --ink:#131A24;
  --ink-2:#5B6675;
  --ink-3:#8B94A2;
  --rule:#DFE4EA;
  --accent:#1F4ED8;
  --t-dart:oklch(0.55 0.16 250);
  --t-android:oklch(0.58 0.15 150);
  --t-backend:oklch(0.58 0.17 35);
  --t-tools:oklch(0.52 0.14 300);
  --t-async:oklch(0.58 0.14 200);
  --t-general:oklch(0.52 0.02 260);
  --serif:'Newsreader','Noto Serif SC',Georgia,'Songti SC',serif;
  --sans:'Noto Sans SC',system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
button,input{font-family:var(--sans)}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1060px;margin:0 auto;padding:0 24px 90px}

/* ===== 报头 ===== */
.masthead{padding:56px 0 26px;border-bottom:1px solid var(--rule)}
.masthead h1{
  margin:0 0 12px;font-family:var(--serif);font-weight:600;
  font-size:clamp(28px,4.4vw,42px);line-height:1.18;letter-spacing:-.015em;
}
.masthead .lede{margin:0;max-width:62ch;color:var(--ink-2);font-size:14.5px}
.meta{
  display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:18px;
  font-family:var(--mono);font-size:11.5px;color:var(--ink-3);letter-spacing:.01em;
}
.meta b{font-weight:500;color:var(--ink-2)}

/* ===== 分类分布 ===== */
.dist{margin:24px 0 12px}
.dist-bar{display:flex;gap:2px;height:9px}
.dist-bar button{
  border:0;padding:0;cursor:pointer;transition:opacity .18s,transform .18s;
  transform-origin:center;
}
.dist-bar button:hover{opacity:.78}
.dist-bar button.dim{opacity:.22}
.dist-bar button[data-t="dart"]{background:var(--t-dart)}
.dist-bar button[data-t="android"]{background:var(--t-android)}
.dist-bar button[data-t="backend"]{background:var(--t-backend)}
.dist-bar button[data-t="tools"]{background:var(--t-tools)}
.dist-bar button[data-t="async"]{background:var(--t-async)}
.dist-bar button[data-t="general"]{background:var(--t-general)}

/* ===== 工具条 ===== */
.toolbar{
  position:sticky;top:0;z-index:30;background:var(--paper);
  border-bottom:1px solid var(--rule);padding:12px 0;
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
}
.search{
  flex:1 1 260px;display:flex;align-items:center;gap:9px;
  background:var(--surface);border:1px solid var(--rule);padding:9px 12px;
  transition:border-color .18s,box-shadow .18s;
}
.search:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.search svg{flex:none;color:var(--ink-3)}
.search input{
  flex:1;min-width:0;border:0;outline:0;background:transparent;
  font-family:var(--sans);font-size:14px;color:var(--ink);
}
.search input::placeholder{color:var(--ink-3)}
.search kbd{
  font-family:var(--mono);font-size:11px;color:var(--ink-3);
  border:1px solid var(--rule);padding:0 5px;line-height:17px;flex:none;
}
.btn{
  font-family:var(--sans);font-size:13px;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--rule);
  padding:9px 13px;cursor:pointer;transition:border-color .18s,color .18s;
}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.count{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-left:auto;flex:none}

/* ===== 分类筛选 ===== */
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:14px 0 4px}
.chip{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--surface);border:1px solid var(--rule);border-radius:999px;
  padding:4px 12px;font-size:12.5px;color:var(--ink-2);
  cursor:pointer;transition:border-color .18s,color .18s,background .18s;
}
.chip:hover{border-color:var(--ink-2);color:var(--ink)}
.chip.on{border-color:var(--ink);color:var(--ink);background:var(--surface)}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none}
.chip .num{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.chip[data-t="dart"] .dot{background:var(--t-dart)}
.chip[data-t="android"] .dot{background:var(--t-android)}
.chip[data-t="backend"] .dot{background:var(--t-backend)}
.chip[data-t="tools"] .dot{background:var(--t-tools)}
.chip[data-t="async"] .dot{background:var(--t-async)}
.chip[data-t="general"] .dot{background:var(--t-general)}
.chip[data-t="all"] .dot{background:var(--ink)}

/* ===== 布局：字母索引 + 词条 ===== */
.layout{display:grid;grid-template-columns:50px 1fr;gap:22px;align-items:start}
.rail{position:sticky;top:78px;display:flex;flex-direction:column;padding-top:26px}
.rail button{
  font-family:var(--mono);font-size:11.5px;line-height:1.5;
  color:var(--ink-3);background:none;border:0;text-align:left;
  padding:1px 6px;cursor:pointer;transition:color .15s,background .15s;
}
.rail button:hover{color:var(--ink);background:var(--surface)}
.rail button.off{opacity:.3;cursor:default}
.rail button.off:hover{background:none;color:var(--ink-3)}

/* ===== 词条 ===== */
.list{border-top:1px solid var(--rule)}
.entry{border-bottom:1px solid var(--rule);transition:background .3s;scroll-margin-top:80px}
.entry.flash{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.entry-head{
  width:100%;display:grid;
  grid-template-columns:42px minmax(150px,214px) 128px 1fr 22px;
  align-items:baseline;gap:16px;
  padding:15px 10px 15px 0;background:none;border:0;
  font:inherit;color:inherit;text-align:left;cursor:pointer;
}
.entry-head:hover{background:var(--surface)}
.entry-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.idx{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.hw .w{
  display:block;font-family:var(--serif);font-weight:600;
  font-size:21.5px;line-height:1.25;letter-spacing:-.01em;
}
.hw .ph{display:block;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:3px}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2)}
.tag .dot{width:7px;height:7px;border-radius:50%;flex:none}
.tag[data-t="dart"] .dot{background:var(--t-dart)}
.tag[data-t="android"] .dot{background:var(--t-android)}
.tag[data-t="backend"] .dot{background:var(--t-backend)}
.tag[data-t="tools"] .dot{background:var(--t-tools)}
.tag[data-t="async"] .dot{background:var(--t-async)}
.tag[data-t="general"] .dot{background:var(--t-general)}
.short{color:var(--ink-2);font-size:14px}
.chev{align-self:center;color:var(--ink-3);transition:transform .28s ease}
.entry.open .chev{transform:rotate(180deg)}
.entry-head:hover .w{color:var(--accent)}
mark{background:color-mix(in srgb,var(--accent) 16%,transparent);color:inherit;padding:0 1px}

.entry-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.4,0,.2,1)}
.entry.open .entry-body{grid-template-rows:1fr}
.entry-body>.inner{overflow:hidden}
.body-pad{padding:2px 10px 26px 58px;max-width:74ch}

.sec{margin:0 0 15px}
.sec h4{margin:0 0 5px;font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:.02em}
.def{list-style:none;margin:0;padding:0}
.def li{position:relative;padding-left:16px;color:var(--ink-2);font-size:14px}
.def li+li{margin-top:3px}
.def li:before{content:"";position:absolute;left:0;top:.78em;width:7px;height:1px;background:var(--ink-3)}
.def strong{color:var(--ink);font-weight:600}
.uses{display:flex;flex-wrap:wrap;gap:6px}
.uses span{
  font-family:var(--mono);font-size:12px;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--rule);padding:3px 8px;
}
.ex{margin-bottom:9px}
.ex .en{margin:0;font-family:var(--serif);font-size:16.5px;line-height:1.5}
.ex .zh{margin:1px 0 0;font-size:13px;color:var(--ink-3)}
.deriv{margin:0;font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.tip{border-top:1px solid var(--rule);padding-top:11px}
.tip p{margin:0;font-size:13.5px;color:var(--ink-2)}
.tip strong{color:var(--ink);font-weight:600}
table.vs{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13.5px}
table.vs th{
  text-align:left;font-weight:500;font-size:12px;color:var(--ink-3);
  border-bottom:1px solid var(--rule);padding:3px 10px 4px 0;
}
table.vs td{padding:5px 10px 5px 0;border-bottom:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
table.vs td:first-child{font-family:var(--mono);font-size:12.5px;color:var(--ink)}
table.vs tr:last-child td{border-bottom:0}
table.vs strong{color:var(--ink);font-weight:600}

.empty{padding:64px 8px;text-align:center;color:var(--ink-3)}
.empty p{margin:0}
.empty .big{font-family:var(--serif);font-size:22px;color:var(--ink-2);margin-bottom:6px}

.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--rule);
  display:flex;flex-wrap:wrap;gap:6px 20px;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}

@media (max-width:880px){
  .layout{grid-template-columns:1fr}
  .rail{display:none}
}
@media (max-width:720px){
  .wrap{padding:0 16px 72px}
  .masthead{padding:36px 0 22px}
  .entry-head{
    grid-template-columns:32px 1fr 20px;grid-template-areas:"idx hw chev" "short short short" "tag tag tag";
    gap:6px 12px;padding:14px 4px 14px 0;align-items:center;
  }
  .idx{grid-area:idx;align-self:start;padding-top:4px;font-size:12px}
  .hw .ph{font-size:12.5px}
  .hw{grid-area:hw}
  .tag{grid-area:tag;margin-top:2px}
  .short{grid-area:short}
  .chev{grid-area:chev}
  .body-pad{padding:2px 4px 24px 32px}
  .count{margin-left:0;width:100%}
  .meta,.count,.foot{font-size:12px}
  .search input{font-size:16px}
  .btn{min-height:44px;display:inline-flex;align-items:center}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <h1>开发技术单词手册</h1>
    <p class="lede">把对话里查过、学过的技术英语词条收在一处：默认只显示词与一句话解释，点开看释义、搭配、例句和易混辨析。可用搜索框按单词、中文释义或例句检索。</p>
    <div class="meta">
      <span>收录 <b id="m-total">0</b> 条</span>

  <!-- ===== 分类分布条 ===== -->
  <section class="dist" aria-label="分类分布">
    <div class="dist-bar" id="dist"></div>
  </section>
  <div class="chips" id="chips" role="group" aria-label="按分类筛选"></div>

  <!-- ===== 工具条 ===== -->
  <div class="toolbar">
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
      <input id="q" type="search" placeholder="搜索单词 / 释义 / 搭配 / 例句" aria-label="搜索词条" autocomplete="off">

    <button class="btn" id="toggle-all" type="button">展开全部</button>

  <!-- ===== 字母索引 + 词条列表 ===== -->
  <div class="layout">

    <div class="list" id="list"></div>

  <p class="foot">
    <span>词条来自本会话中查过、学过的单词，按出现顺序编号</span>
    <span>中文释义按开发语境整理，非通用词典释义</span>
  </p>
</div>

<script>
/* ===== 词条数据 ===== */
/* tag: dart=Flutter/Dart  android=Android/Kotlin  backend=后端/网络  tools=工程/工具  async=并发/协程  general=通用 */
const WORDS = [
{w:"tuple",ph:"/ˈtjuːpl/",pos:"n.",tag:"dart",
 short:"元组：有序、不可变的数据集合",
 def:["编程术语，指**一组有序且不可变的数据集合**，创建后不能增删改元素。","和 list（列表）相对：list 可变，tuple 不可变。"],
 uses:["Dart 3: (1, 'a', true)","Python: (1, 2)","返回多个值"],

{w:"Fibonacci",ph:"/ˌfɪbəˈnɑːtʃi/",pos:"n.",tag:"general",
 short:"斐波那契：后一项等于前两项之和的数列",
 def:["斐波那契数列：1, 1, 2, 3, 5, 8, 13……从第三项起，每项等于前两项之和。","常用于讲递归与动态规划，也常被拿来当动画缓动曲线的形状。"],
 uses:["Fibonacci sequence 斐波那契数列","Fibonacci number 斐波那契数"],
 ex:[["Fibonacci sequence is a classic recursion example.","斐波那契数列是经典的递归示例。"]],
 vs:[["Fibonacci","指数列本身"],["golden ratio 黄金分割","斐波那契相邻两项之比会趋近它"]]},

{w:"mutating",ph:"/ˈmjuːteɪtɪŋ/",pos:"v./adj.",tag:"dart",
 short:"会修改原数据的；原地变更",

 uses:["mutating method 可变方法","non-mutating 非原地修改"],
 ex:[["This is a mutating operation, it changes the original list.","这是一个可变操作，它会修改原列表。"]],
 vs:[["mutating","原地修改，原对象随之变化"],["immutable","不可变，改动会返回一个新对象"]]},

{w:"emit",ph:"/ɪˈmɪt/",pos:"v.",tag:"dart",

 ex:[["Clicking the button triggers a refresh.","点击按钮会触发一次刷新。"]],
 deriv:"triggered adj. 被触发的"},

 tip:"音速不是固定值，和温度、海拔有关；温度越低音速越低。"},

{w:"diameter",ph:"/daɪˈæmɪtə(r)/",pos:"n.",tag:"general",

 short:"海拔高度；高度",

 ex:[["We dial 0.2 mrad of elevation up.","向上调0.2毫弧度高低修正。"]],
 deriv:"rad = radian 弧度",

/* ===== 渲染与交互 ===== */
const TAGNAME={dart:'Flutter / Dart',android:'Android / Kotlin',backend:'后端 / 网络',tools:'工程 / 工具',async:'并发 / 协程',general:'通用'};
const ORDER=['dart','android','backend','tools','async','general'];
const list=document.getElementById('list');
const rail=document.getElementById('rail');
const chipsEl=document.getElementById('chips');
const distEl=document.getElementById('dist');
const qEl=document.getElementById('q');
const countEl=document.getElementById('count');
const toggleAll=document.getElementById('toggle-all');
const state={q:'',tag:'all',open:new Set()};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function hl(s){
  const out=fmt(s);
  const q=state.q.trim();
  if(!q) return out;
  try{return out.replace(new RegExp('('+reEsc(q)+')','ig'),'<mark>$1</mark>');}catch(err){return out;}
}
function hay(e){
  return [e.w,e.ph,e.pos,e.short,(e.def||[]).join(' '),(e.uses||[]).join(' '),
    (e.ex||[]).map(x=>x.join(' ')).join(' '),e.deriv||'',
    (e.vs||[]).map(x=>x.join(' ')).join(' '),e.tip||'',TAGNAME[e.tag]].join(' ').toLowerCase();
}
const PAD=n=>(n<10?'0':'')+n;
const initial=e=>e.w[0].toUpperCase();

function secBody(e){
  let h='';
  if(e.def&&e.def.length) h+='<div class="sec"><h4>释义</h4><ul class="def">'+e.def.map(d=>'<li>'+fmt(d)+'</li>').join('')+'</ul></div>';
  if(e.uses&&e.uses.length) h+='<div class="sec"><h4>常用搭配</h4><div class="uses">'+e.uses.map(u=>'<span>'+esc(u)+'</span>').join('')+'</div></div>';
  if(e.ex&&e.ex.length) h+='<div class="sec"><h4>例句</h4>'+e.ex.map(x=>'<div class="ex"><p class="en">'+esc(x[0])+'</p><p class="zh">'+esc(x[1])+'</p></div>').join('')+'</div>';
  if(e.deriv) h+='<div class="sec"><h4>派生词</h4><p class="deriv">'+fmt(e.deriv)+'</p></div>';
  if(e.vs&&e.vs.length) h+='<div class="sec"><h4>易混辨析</h4><table class="vs"><colgroup><col style="width:31%"><col style="width:69%"></colgroup><thead><tr><th>词</th><th>区别</th></tr></thead><tbody>'+e.vs.map(v=>'<tr><td>'+esc(v[0])+'</td><td>'+fmt(v[1])+'</td></tr>').join('')+'</tbody></table></div>';
  if(e.tip) h+='<div class="sec tip"><h4>提示</h4><p>'+fmt(e.tip)+'</p></div>';
  return h;
}

const CHEV='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';

function rowHTML(e,i){
  const on=state.open.has(e.w);
  return '<article class="entry'+(on?' open':'')+'" data-i="'+i+'" data-l="'+initial(e)+'">'
    +'<button class="entry-head" type="button" aria-expanded="'+on+'" aria-controls="body-'+i+'">'
    +'<span class="idx">'+PAD(i+1)+'</span>'
    +'<span class="hw"><span class="w">'+hl(e.w)+'</span><span class="ph">'+esc(e.ph)+(e.pos?' · '+esc(e.pos):'')+'</span></span>'
    +'<span class="tag" data-t="'+e.tag+'"><span class="dot"></span>'+TAGNAME[e.tag]+'</span>'
    +'<span class="short">'+hl(e.short)+'</span>'
    +'<span class="chev">'+CHEV+'</span>'
    +'</button>'
    +'<div class="entry-body" id="body-'+i+'"><div class="inner"><div class="body-pad">'+secBody(e)+'</div></div></div>'
    +'</article>';
}

function filtered(){
  const q=state.q.trim().toLowerCase();
  return WORDS.map((e,i)=>({e,i})).filter(({e})=>{
    if(state.tag!=='all'&&e.tag!==state.tag) return false;
    if(!q) return true;
    return hay(e).indexOf(q)>-1;
  });
}

function render(){
  const rows=filtered();
  if(!rows.length){
    list.innerHTML='<div class="empty"><p class="big">没有匹配的词条</p><p>换个关键词，或者点「全部」看完整词库。</p></div>';
  }else{
    list.innerHTML=rows.map(({e,i})=>rowHTML(e,i)).join('');
  }
  countEl.textContent='结果 '+rows.length+' / '+WORDS.length+' 条';
  // 字母索引
  const letters=[];
  rows.forEach(({e})=>{const L=initial(e); if(letters.indexOf(L)<0) letters.push(L);});
  letters.sort();
  rail.innerHTML=letters.map(L=>'<button type="button" data-jump="'+L+'">'+L+'</button>').join('');
  // 分类状态
  chipsEl.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.t===state.tag));
  distEl.querySelectorAll('button').forEach(b=>b.classList.toggle('dim',state.tag!=='all'&&b.dataset.t!==state.tag));
  // 展开全部按钮文案
  const visible=rows.map(({e})=>e.w);
  const allOpen=visible.length>0&&visible.every(w=>state.open.has(w));
  toggleAll.textContent=allOpen?'全部收起':'展开全部';
}

/* ===== 初始化：分布条与分类 chips ===== */
(function initChips(){
  document.getElementById('m-total').textContent=WORDS.length;
  const counts={};
  WORDS.forEach(e=>counts[e.tag]=(counts[e.tag]||0)+1);
  distEl.innerHTML=ORDER.filter(t=>counts[t]).map(t=>'<button type="button" data-t="'+t+'" style="flex:'+counts[t]+'" title="'+TAGNAME[t]+' '+counts[t]+' 条" aria-label="'+TAGNAME[t]+' '+counts[t]+' 条"></button>').join('');
  chipsEl.innerHTML=['<button class="chip" type="button" data-t="all"><span class="dot"></span>全部<span class="num">'+WORDS.length+'</span></button>']
    .concat(ORDER.filter(t=>counts[t]).map(t=>'<button class="chip" type="button" data-t="'+t+'"><span class="dot"></span>'+TAGNAME[t]+'<span class="num">'+counts[t]+'</span></button>')).join('');
})();

/* ===== 事件 ===== */
list.addEventListener('click',ev=>{
  const head=ev.target.closest('.entry-head');
  if(!head) return;
  const art=head.closest('.entry');
  const e=WORDS[+art.dataset.i];
  const open=!art.classList.contains('open');
  art.classList.toggle('open',open);
  head.setAttribute('aria-expanded',String(open));
  if(open) state.open.add(e.w); else state.open.delete(e.w);
  render();
});

function setTag(t){
  state.tag=(state.tag===t&&t!=='all')?'all':t;
  render();
}
chipsEl.addEventListener('click',ev=>{
  const c=ev.target.closest('.chip'); if(!c) return; setTag(c.dataset.t);
});
distEl.addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return; setTag(b.dataset.t);
});

rail.addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  const art=list.querySelector('.entry[data-l="'+b.dataset.jump+'"]');
  if(!art) return;
  art.scrollIntoView({behavior:'smooth',block:'start'});
  art.classList.add('flash');
  setTimeout(()=>art.classList.remove('flash'),1200);
});

let timer=null;
qEl.addEventListener('input',()=>{
  clearTimeout(timer);
  timer=setTimeout(()=>{state.q=qEl.value;render();},120);
});

toggleAll.addEventListener('click',()=>{
  const rows=filtered().map(({e})=>e.w);
  const allOpen=rows.length>0&&rows.every(w=>state.open.has(w));
  rows.forEach(w=>{allOpen?state.open.delete(w):state.open.add(w);});
  render();
});

document.addEventListener('keydown',ev=>{
  if(ev.key==='/'&&document.activeElement!==qEl){ev.preventDefault();qEl.focus();}
  else if(ev.key==='Escape'&&document.activeElement===qEl){qEl.value='';state.q='';render();qEl.blur();}
});

render();
</script>
</body>
</html>
